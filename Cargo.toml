[package]
name = "zellij-tab-quicksearch"
version = "0.1.0"
edition = "2021"
description = "Zellij plugin: fuzzy tab switcher with frequency-based sort"
license = "MIT"
authors = ["Christian Wohlert <christian667@gmail.com>"]
readme = "README.md"

[dependencies]
zellij-tile = "0.44.3"
nucleo-matcher = "0.3.1"
unicode-width = "0.2.2"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
